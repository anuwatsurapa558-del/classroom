  let html=`<div style="padding:12px">`;
  if(cur.length){
    html+=`<div style="font-weight:700;font-size:14px;margin-bottom:8px;color:var(--gn)"><i class="ti ti-player-play"></i> ข้อสอบที่ต้องทำ (${cur.length})</div>`;
    cur.forEach(q=>{
      const nQ=(q.questions||[]).length;
      const totalPts=(q.questions||[]).reduce((s,x)=>s+(parseFloat(x.points)||0),0);
      const subject=subArr(me.classId).find(s=>s.id===q.subject_id);
      const att=stuAttempts[q.id];
      const isResume=att&&att.status==='in_progress';
      html+=`
        <div style="background:#F0FDF4;border:1.5px solid var(--gn);border-radius:10px;padding:14px;margin-bottom:8px">
          <div style="font-weight:700;font-size:14.5px">${q.title}${isResume?' <span style="font-size:11px;color:var(--am);background:#FEF3C7;padding:1px 6px;border-radius:6px">ค้างอยู่</span>':''}</div>
          <div style="font-size:12px;color:var(--mu);margin-top:2px">${subject?.name||''} · ${nQ} ข้อ · เต็ม ${totalPts} คะแนน ${q.time_limit_min?` · ⏰ ${q.time_limit_min} นาที`:' · ⏰ ไม่จำกัดเวลา'}</div>
          ${q.description?`<div style="font-size:12.5px;color:#555;margin-top:6px">${q.description}</div>`:''}
          <button class="btn btn-p" style="margin-top:10px;width:100%" onclick="startQuiz('${q.id}')"><i class="ti ti-player-play"></i> ${isResume?'ทำต่อ':'เริ่มทำข้อสอบ'}</button>
        </div>`;
    });
  }
  if(done.length){
    html+=`<div style="font-weight:700;font-size:14px;margin:16px 0 8px"><i class="ti ti-check"></i> ทำเสร็จแล้ว (${done.length})</div>`;
    done.forEach(q=>{
      const a=stuAttempts[q.id];
      const showAns=q.show_answers==='immediate'||(q.show_answers==='after_close'&&q.status==='closed');
      const percent=a.max_score>0?Math.round(a.total_score/a.max_score*100):0;
      html+=`
        <div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div style="flex:1">
              <div style="font-weight:700;font-size:14px">${q.title}</div>
              <div style="font-size:12px;color:var(--mu);margin-top:2px">คะแนน: <b style="color:${percent>=60?'var(--gn)':'var(--rd)'}">${fmtScore(a.total_score)} / ${fmtScore(a.max_score)}</b> (${percent}%)</div>
            </div>
            ${showAns?`<button class="btn btn-xs" onclick="viewQuizResult('${q.id}')"><i class="ti ti-eye"></i> ดูเฉลย</button>`:'<span style="font-size:11px;color:var(--mu)">รอเฉลย</span>'}
          </div>
        </div>`;
    });
  }
  if(closed.length){
    html+=`<div style="font-weight:700;font-size:14px;margin:16px 0 8px;color:var(--mu)"><i class="ti ti-lock"></i> ปิดแล้ว (${closed.length}) — ไม่ได้ทำ</div>`;
    closed.forEach(q=>{
      html+=`<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;opacity:.7">
        <div style="font-weight:700;font-size:14px">${q.title}</div>
      </div>`;
    });
  }
  html+='</div>';
  el.innerHTML=html;
}

// ── เริ่มทำข้อสอบ ──
async function startQuiz(quizId){
  const q=stuQuizData[quizId];
  if(!q)return;
  const nQ=(q.questions||[]).length;
  if(!nQ){showToast('ข้อสอบนี้ยังไม่มีคำถาม');return;}

  // ตรวจว่ามี attempt in_progress ค้างอยู่ไหม → resume แทน create ใหม่
  const existingAtt=stuAttempts[quizId];
  if(existingAtt&&existingAtt.status==='in_progress'){
    if(confirm('มีการทำข้อสอบค้างอยู่ ต้องการทำต่อจากที่ค้างไว้?')){
      // Resume
      let questions=[...(q.questions||[])];
      if(q.shuffle_questions)questions=_shuffle(questions);
      if(q.shuffle_options){
        questions=questions.map(qq=>{
          if(qq.type==='mc'&&qq.data?.options){
            const idx=qq.data.options.map((_,i)=>i);
            const shuf=_shuffle(idx);
            return{...qq,data:{...qq.data,options:shuf.map(i=>qq.data.options[i]),correct:shuf.indexOf(qq.data.correct),_shuffleMap:shuf}};
          }
          return qq;
        });
      }
      activeQuiz={...q,questions,passages:q.passages||[]};
      activeAttempt={...existingAtt,answers:existingAtt.answers||{}};
      quizStartTime=Date.now();
      _lastSaveTimeStu=Date.now();
      _setupAntiCheat();
      renderStuQuiz();
      return;
    }
    // user ปฏิเสธ = ไม่ทำอะไร
    return;
  }

  let msg=`ทำข้อสอบ "${q.title}"?\n\n`;
  msg+=`• จำนวน ${nQ} ข้อ\n`;
  if(q.time_limit_min)msg+=`• เวลา ${q.time_limit_min} นาที (จะเริ่มจับเวลาทันทีที่กดตกลง)\n`;
  msg+=`\nพร้อมทำแล้วใช่ไหม?`;
  if(!confirm(msg))return;
  try{
    // เตรียมคำถาม (สลับถ้าตั้งค่าไว้)
    let questions=[...(q.questions||[])];
    if(q.shuffle_questions)questions=_shuffle(questions);
    if(q.shuffle_options){
      questions=questions.map(qq=>{
        if(qq.type==='mc'&&qq.data?.options){
          const idx=qq.data.options.map((_,i)=>i);
          const shuf=_shuffle(idx);
          return{
            ...qq,
            data:{
              ...qq.data,
              options:shuf.map(i=>qq.data.options[i]),
              correct:shuf.indexOf(qq.data.correct),
              _shuffleMap:shuf
            }
          };
        }
        return qq;
      });
    }
    // หา attempt_num ที่ยังไม่ใช้ (กันซ้ำเมื่อครูรีเซ็ตแล้วมี row เดิมค้าง)
    const {data:existing}=await sb.from('quiz_attempts')
      .select('attempt_num').eq('quiz_id',quizId).eq('student_id',me.studentId)
      .order('attempt_num',{ascending:false}).limit(1);
    const nextNum=(existing&&existing[0]?existing[0].attempt_num:0)+1;
    // สร้าง attempt ใหม่
    const attempt={
      quiz_id:quizId, student_id:me.studentId, attempt_num:nextNum,
      status:'in_progress', answers:{}, raw_score:0, max_score:questions.reduce((s,x)=>s+(parseFloat(x.points)||0),0)
    };
    const {data:inserted,error}=await sb.from('quiz_attempts').insert(attempt).select().single();
    if(error){
      if(error.message.includes('duplicate')){
        alert('มีการทำข้อสอบค้างอยู่ กรุณา refresh หน้าใหม่ (Pull-down)');
        return;
      }
      throw error;
    }
    activeQuiz={...q,questions,passages:q.passages||[]};
    activeAttempt={...inserted,answers:{}};
    quizStartTime=Date.now();
    _lastSaveTimeStu=Date.now();
    _setupAntiCheat();
    renderStuQuiz();
  }catch(e){console.error(e);alert('เริ่มไม่สำเร็จ: '+e.message);}
}

function _shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── หน้าทำข้อสอบ ──
function renderTakeQuiz(){
  const el=document.getElementById('mainContent');
  const q=activeQuiz;
  const a=activeAttempt;
  const qs=q.questions||[];
  const answered=Object.keys(a.answers||{}).filter(k=>{
    const v=a.answers[k];
    if(v===undefined||v===null||v==='')return false;
    if(Array.isArray(v)&&!v.length)return false;
    if(Array.isArray(v)&&v.every(x=>x===undefined||x===null||x===''))return false;
    return true;
  }).length;

  // Timer
  let timerHtml='';
  if(q.time_limit_min){
    if(!quizTimer){
      quizTimer=setInterval(()=>{
        const timeEl=document.getElementById('qzTimeLeft');
        if(!timeEl){clearInterval(quizTimer);quizTimer=null;return;}
        const elapsed=Math.floor((Date.now()-quizStartTime)/1000);
        const left=q.time_limit_min*60-elapsed;
        if(left<=0){
          clearInterval(quizTimer);quizTimer=null;
          alert('หมดเวลา ระบบจะส่งข้อสอบอัตโนมัติ');
          submitQuiz(true);
          return;
        }
        const m=Math.floor(left/60),s=left%60;
        timeEl.textContent=m+':'+String(s).padStart(2,'0');
        timeEl.style.color=left<60?'var(--rd)':(left<300?'var(--am)':'var(--gn)');
      },1000);
    }
    timerHtml=`<div style="background:var(--sf2);padding:8px 12px;border-radius:8px;font-size:13px;text-align:center"><i class="ti ti-clock"></i> เวลาที่เหลือ: <b id="qzTimeLeft" style="color:var(--gn);font-family:monospace;font-size:16px">${q.time_limit_min}:00</b></div>`;
  }

  let html=`
    <div style="padding:10px 12px;background:var(--sf2);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
        <b style="font-size:14px">${q.title}</b>
        <span id="qzProgress" style="font-size:12px;color:var(--mu)">ตอบแล้ว ${answered}/${qs.length}</span>
      </div>
      ${timerHtml}
    </div>
    <div style="padding:12px">`;

  // Merge questions + passages by order_num
  const passages=activeQuiz.passages||[];
  const items=[];
  qs.forEach(x=>items.push({kind:'q',order:x.order_num||0,data:x}));
  passages.forEach(x=>items.push({kind:'p',order:x.order_num||0,data:x}));
  items.sort((a,b)=>a.order-b.order);

  let qNum=0;
  items.forEach((it,idx)=>{
    if(it.kind==='p'){
      const p=it.data;
      html+=`<div style="background:#F0F9FF;border:1.5px solid #93C5FD;border-radius:10px;padding:14px;margin-bottom:12px">
        <div style="font-weight:700;font-size:13px;color:#1E40AF;margin-bottom:6px"><i class="ti ti-book"></i> ${p.title||'ส่วนหัว'}</div>
        ${p.content_text?`<div style="font-size:14px;line-height:1.6;padding:8px;background:#fff;border-radius:6px;white-space:pre-wrap">${(p.content_text||'').replace(/</g,'&lt;')}</div>`:''}
        ${p.image_url?`<img src="${p.image_url}" style="max-width:100%;max-height:260px;border-radius:6px;margin-top:8px;border:1px solid var(--bd)">`:''}
      </div>`;
      return;
    }
    qNum++;
    const qq=it.data;
    const i=qNum-1;
    const cur=a.answers[qq.id];
    const qImgHtml=qq.image_url?`<div style="margin:8px 0"><img src="${qq.image_url}" style="max-width:100%;max-height:250px;border-radius:6px;border:1px solid var(--bd)"></div>`:'';
    const optImgs=qq.option_images||[];
    let ansHtml='';
    if(qq.type==='mc'){
      const opts=qq.data?.options||[];
      const map=qq.data?._shuffleMap;
      ansHtml=opts.map((o,j)=>{
        const optImg=optImgs[j]?`<img src="${optImgs[j]}" style="max-width:80px;max-height:60px;border-radius:4px;border:1px solid var(--bd);margin-top:4px;display:block">`:'';
        // cur เก็บเป็น original index; ถ้ามี shuffle map ให้ compare กับ map[j] (=original)
        const origIdx=map?map[j]:j;
        const isSelected=cur===origIdx;
        return `<label style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:${isSelected?'#EFF6FF':'#fff'};border:1.5px solid ${isSelected?'var(--bl)':'var(--bd)'};border-radius:8px;margin-bottom:6px;cursor:pointer">
          <input type="radio" name="qz_${qq.id}" value="${j}" ${isSelected?'checked':''} onchange="saveAnswer('${qq.id}',${j})" style="margin-top:3px">
          <div style="flex:1"><b>${['ก','ข','ค','ง','จ','ฉ'][j]||j+1}.</b> ${o}${optImg}</div>
        </label>`;}).join('');
    } else if(qq.type==='multi'){
      const opts=qq.data?.options||[];
      const curArr=Array.isArray(cur)?cur:[];
      const map=qq.data?._shuffleMap;
      ansHtml=opts.map((o,j)=>{
        const optImg=optImgs[j]?`<img src="${optImgs[j]}" style="max-width:80px;max-height:60px;border-radius:4px;border:1px solid var(--bd);margin-top:4px;display:block">`:'';
        const origIdx=map?map[j]:j;
        const isChecked=curArr.includes(origIdx);
        return `<label style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:${isChecked?'#EFF6FF':'#fff'};border:1.5px solid ${isChecked?'var(--bl)':'var(--bd)'};border-radius:8px;margin-bottom:6px;cursor:pointer">
          <input type="checkbox" value="${j}" ${isChecked?'checked':''} onchange="saveMultiAnswer('${qq.id}',${j},this.checked)" style="margin-top:3px">
          <div style="flex:1"><b>${['ก','ข','ค','ง','จ','ฉ'][j]||j+1}.</b> ${o}${optImg}</div>
        </label>`;}).join('')+`<div style="font-size:11px;color:var(--mu);margin-top:2px">💡 เลือกได้หลายข้อ</div>`;
    } else if(qq.type==='tf'){
      ansHtml=`
        <div style="display:flex;gap:8px">
          <label style="flex:1;display:flex;align-items:center;justify-content:center;padding:10px;background:${cur===true?'#F0FDF4':'#fff'};border:1.5px solid ${cur===true?'var(--gn)':'var(--bd)'};border-radius:8px;cursor:pointer;gap:6px">
            <input type="radio" name="qz_${qq.id}" ${cur===true?'checked':''} onchange="saveAnswer('${qq.id}',true)">
            <b>✓ ถูก</b>
          </label>
          <label style="flex:1;display:flex;align-items:center;justify-content:center;padding:10px;background:${cur===false?'#FEF2F2':'#fff'};border:1.5px solid ${cur===false?'var(--rd)':'var(--bd)'};border-radius:8px;cursor:pointer;gap:6px">
            <input type="radio" name="qz_${qq.id}" ${cur===false?'checked':''} onchange="saveAnswer('${qq.id}',false)">
            <b>✗ ผิด</b>
          </label>
        </div>`;
    } else if(qq.type==='fill'){
      ansHtml=`<input type="text" value="${(cur||'').replace(/"/g,'&quot;')}" oninput="saveAnswer('${qq.id}',this.value)" placeholder="พิมพ์คำตอบ" style="width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit">`;
    } else if(qq.type==='cloze'){
      // Render template with blanks as inline inputs/dropdowns
      const template=qq.data?.template||'';
      const blanks=qq.data?.blanks||[];
      const mode=qq.data?.mode||'input';
      const curArr=Array.isArray(cur)?cur:[];
      // สำหรับ dropdown mode ใช้ dropdownOptions ที่ครูใส่ (ไม่ใช่ answers ที่เป็นเฉลย)
      // Shuffle ตัวเลือกครั้งเดียวต่อคำถาม เพื่อไม่ให้นักเรียนเดาจากลำดับ
      let ddOpts=[];
      if(mode==='dropdown'){
        const rawOpts=qq.data?.dropdownOptions||[];
        if(rawOpts.length){
          // Deterministic shuffle เพื่อให้แต่ละคนเห็นลำดับเดียวกันตลอดข้อสอบ
          if(!qq._ddShuffled){
            qq._ddShuffled=_shuffle([...rawOpts]);
          }
          ddOpts=qq._ddShuffled;
        }
      }
      // Split template by [N] markers
      const parts=template.split(/(\[\d+\])/);
      const rendered=parts.map(part=>{
        const m=part.match(/\[(\d+)\]/);
        if(m){
          const idx=parseInt(m[1])-1;
          const b=blanks[idx];
          const v=(curArr[idx]||'').replace(/"/g,'&quot;');
          if(mode==='dropdown'&&b){
            const opts=ddOpts.map(a=>`<option value="${a}" ${v===a?'selected':''}>${a}</option>`).join('');
            return `<select onchange="saveClozeAnswer('${qq.id}',${idx},this.value)" style="display:inline-block;padding:4px 8px;margin:0 4px;border:1.5px solid var(--bl);border-radius:6px;font-family:inherit;font-size:14px;background:#EFF6FF"><option value="">-- เลือก --</option>${opts}</select>`;
          }
          return `<input type="text" value="${v}" oninput="saveClozeAnswer('${qq.id}',${idx},this.value)" placeholder="[${idx+1}]" style="display:inline-block;width:auto;min-width:80px;padding:4px 8px;margin:0 4px;border:1.5px solid var(--bl);border-radius:6px;font-family:inherit;font-size:14px;text-align:center;background:#EFF6FF">`;
        }
        return part.replace(/</g,'&lt;');
      }).join('');
      ansHtml=`<div style="font-size:15px;line-height:2.2;padding:8px;background:#fff;border:1px solid var(--bd);border-radius:8px">${rendered}</div>`;
    } else if(qq.type==='essay'){
      const inst=qq.data?.instruction||'';
      ansHtml=`
        ${inst?`<div style="font-size:12px;color:var(--mu);padding:6px 10px;background:#FEF3C7;border-radius:6px;margin-bottom:6px">💡 ${inst}</div>`:''}
        <textarea rows="5" oninput="saveAnswer('${qq.id}',this.value)" placeholder="เขียนคำตอบที่นี่..." style="width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit;line-height:1.5">${(cur||'').replace(/</g,'&lt;')}</textarea>
        <div style="font-size:11px;color:var(--am);margin-top:2px">⚠️ ครูจะตรวจให้คะแนนเอง (ไม่ตรวจอัตโนมัติ)</div>`;
    } else if(qq.type==='match'){
      // shuffle right column ครั้งเดียวต่อคำถาม
      const pairs=qq.data?.pairs||[];
      if(!qq._matchRShuf){
        qq._matchRShuf=_shuffle(pairs.map((_,idx)=>idx));
      }
      const userMap=cur&&typeof cur==='object'?cur:{};
      // แสดง lefts (in order) ↔ rights (shuffled)
      const leftsHtml=pairs.map((p,li)=>{
        const chosenIdx=userMap[li];
        return `<button class="btn ${activeAttempt._matchSelLeft===li?'btn-p':''}" data-li="${li}" onclick="_matchClickLeft('${qq.id}',${li})" style="width:100%;text-align:left;padding:10px;margin-bottom:6px">
          <b>${li+1}.</b> ${p.left}
          ${chosenIdx!==undefined?`<span style="float:right;color:var(--gn);font-size:12px">→ ${pairs[chosenIdx]?.right||'?'}</span>`:''}
        </button>`;
      }).join('');
      const rightsHtml=qq._matchRShuf.map(ri=>{
        const p=pairs[ri];
        const usedBy=Object.entries(userMap).find(([,v])=>parseInt(v)===ri);
        return `<button class="btn ${usedBy?'btn-t':''}" onclick="_matchClickRight('${qq.id}',${ri})" style="width:100%;text-align:left;padding:10px;margin-bottom:6px${usedBy?';opacity:.5':''}">
          ${p.right}${usedBy?` <span style="font-size:11px;color:var(--mu)">(ข้อ ${parseInt(usedBy[0])+1})</span>`:''}
        </button>`;
      }).join('');
      ansHtml=`
        <div style="font-size:11.5px;color:var(--mu);margin-bottom:8px">💡 แตะซ้าย แล้วแตะขวาที่ตรงกัน</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><b style="font-size:12px;color:var(--mu)">ซ้าย</b>${leftsHtml}</div>
          <div><b style="font-size:12px;color:var(--mu)">ขวา</b>${rightsHtml}</div>
        </div>
        <div style="text-align:center;margin-top:6px"><button class="btn btn-xs" onclick="_matchReset('${qq.id}')"><i class="ti ti-refresh"></i> ล้าง</button></div>`;
    } else if(qq.type==='order'){
      const items=qq.data?.items||[];
      // ผสม order เริ่มต้น (ถ้ายังไม่มี)
      if(!qq._orderShuf){
        qq._orderShuf=_shuffle(items.map((_,i)=>i));
      }
      const given=Array.isArray(cur)?cur:qq._orderShuf.slice();
      if(!Array.isArray(cur)){
        // Save initial order
        activeAttempt.answers[qq.id]=given;
      }
      ansHtml=`
        <div style="font-size:11.5px;color:var(--mu);margin-bottom:8px">💡 แตะ ↑/↓ เพื่อเรียงลำดับ (ก่อน → หลัง)</div>
        <div>
          ${given.map((idx,pos)=>`
            <div style="display:flex;align-items:center;gap:6px;padding:10px;background:#EFF6FF;border:1.5px solid var(--bl);border-radius:8px;margin-bottom:6px">
              <b style="min-width:24px;color:var(--bl)">${pos+1}.</b>
              <span style="flex:1;font-weight:600">${items[idx]||'?'}</span>
              <button class="btn btn-xs" ${pos===0?'disabled':''} onclick="_orderMove('${qq.id}',${pos},-1)"><i class="ti ti-arrow-up"></i></button>
              <button class="btn btn-xs" ${pos===given.length-1?'disabled':''} onclick="_orderMove('${qq.id}',${pos},1)"><i class="ti ti-arrow-down"></i></button>
            </div>`).join('')}
        </div>`;
    } else if(qq.type==='wordbank'){
      const template=qq.data?.template||'';
      const bank=qq.data?.bank||[];
      const answers=qq.data?.answers||[];
      const given=Array.isArray(cur)?cur:new Array(answers.length).fill('');
      // shuffle bank once
      if(!qq._wbShuf){qq._wbShuf=_shuffle([...bank]);}
      const parts=template.split(/(\[\d+\])/);
      const rendered=parts.map(part=>{
        const m=part.match(/\[(\d+)\]/);
        if(m){
          const idx=parseInt(m[1])-1;
          const v=given[idx]||'';
          return `<button onclick="_wbClearBlank('${qq.id}',${idx})" style="display:inline-block;padding:4px 12px;margin:0 4px;border:1.5px dashed ${v?'var(--gn)':'var(--bl)'};border-radius:6px;background:${v?'#F0FDF4':'#EFF6FF'};font-family:inherit;font-size:14px;cursor:pointer">${v||`[${idx+1}]`}</button>`;
        }
        return part.replace(/</g,'&lt;');
      }).join('');
      // คำในคลัง — คลิกได้ตลอด (ใช้ซ้ำได้)
      const bankHtml=qq._wbShuf.map(w=>{
        return `<button class="btn btn-p" onclick="_wbPickWord('${qq.id}','${w.replace(/'/g,"\\'")}')" style="margin:3px">${w}</button>`;
      }).join('');
      ansHtml=`
        <div style="font-size:15px;line-height:2.2;padding:12px;background:#fff;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px">${rendered}</div>
        <div style="font-size:11.5px;color:var(--mu);margin-bottom:6px">📚 คลังคำ (แตะเพื่อเลือก · ใช้ซ้ำได้ · แตะช่องเพื่อลบ):</div>
        <div style="text-align:center">${bankHtml}</div>`;
    } else if(qq.type==='categorize'){
      const cats=qq.data?.categories||[];
      const items=qq.data?.items||[];
      // shuffle items once
      if(!qq._catShuf){qq._catShuf=_shuffle(items.map((_,i)=>i));}
      const given=Array.isArray(cur)?cur:new Array(items.length).fill(-1);
      if(!Array.isArray(cur)){activeAttempt.answers[qq.id]=given;}
      const catColors=['#EFF6FF','#F0FDF4','#FEF3C7','#FEE2E2','#EDE9FE','#FCE7F3'];
      const unassigned=qq._catShuf.filter(idx=>given[idx]===-1||given[idx]===undefined);
      ansHtml=`
        <div style="font-size:11.5px;color:var(--mu);margin-bottom:8px">💡 แตะสิ่งของ แล้วแตะกลุ่ม (หรือแตะกลุ่มก่อน แล้วสิ่งของ)</div>
        <div style="background:#fff;border:1px dashed var(--bd);padding:10px;border-radius:8px;margin-bottom:10px">
          <div style="font-size:11px;color:var(--mu);margin-bottom:6px">ยังไม่จัดกลุ่ม (${unassigned.length}):</div>
          ${unassigned.length?unassigned.map(idx=>`<button class="btn ${activeAttempt._catSelIdx===idx?'btn-p':''}" onclick="_catClickItem('${qq.id}',${idx})" style="margin:3px">${items[idx].name}</button>`).join(''):'<span style="font-size:12px;color:var(--gn)">✓ จัดครบแล้ว</span>'}
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">
          ${cats.map((c,ci)=>{
            const inCat=items.map((it,idx)=>({it,idx})).filter(x=>given[x.idx]===ci);
            return `<div onclick="_catClickCat('${qq.id}',${ci})" style="padding:10px;background:${catColors[ci%catColors.length]};border:1.5px solid var(--bd);border-radius:8px;cursor:pointer;min-height:100px">
              <div style="font-weight:700;font-size:13px;margin-bottom:6px">${c}</div>
              ${inCat.map(x=>`<button onclick="event.stopPropagation();_catUnassign('${qq.id}',${x.idx})" style="display:inline-block;padding:3px 8px;margin:2px;background:#fff;border:1px solid var(--bd);border-radius:5px;font-size:11.5px;cursor:pointer">${x.it.name} <span style="color:var(--mu)">×</span></button>`).join('')}
            </div>`;
          }).join('')}
        </div>`;
    }
    html+=`
      <div style="background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="background:var(--tl);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:700">ข้อ ${i+1}</span>
          <span style="font-size:11px;color:var(--mu)">${qq.points} คะแนน</span>
        </div>
        <div style="font-size:14.5px;font-weight:600;margin-bottom:10px">${qq.question}</div>
        ${qImgHtml}
        ${ansHtml}
      </div>`;
  });

  html+=`
      <button id="qzSubmitBtn" class="btn btn-p" style="width:100%;padding:14px;font-size:15px;margin-top:8px" onclick="submitQuiz(false)"><i class="ti ti-send"></i> ส่งข้อสอบ (ตอบแล้ว ${answered}/${qs.length})</button>
    </div>`;
  el.innerHTML=html;
}

// ── บันทึกคำตอบ (auto-save ทุกครั้ง) ──
let _saveAnsTimer=null;
// Internal: persist raw (already converted to original index) answer
function _persistAnswer(qId,storedAns){
  activeAttempt.answers[qId]=storedAns;
  _updateProgressCounter();
  clearTimeout(_saveAnsTimer);
  _saveAnsTimer=setTimeout(async()=>{
    try{
      _lastSaveTimeStu=Date.now();
      await sb.from('quiz_attempts').update({answers:activeAttempt.answers}).eq('id',activeAttempt.id);
    }catch(e){console.error('save answer:',e);}
  },800);
}

async function saveAnswer(qId,ans){
  // ans = index ที่นักเรียนคลิก (shuffled) → แปลงเป็น original ก่อนเก็บ
  const qq=(activeQuiz.questions||[]).find(x=>x.id===qId);
  let stored=ans;
  if(qq&&qq.data?._shuffleMap){
    const map=qq.data._shuffleMap;
    if(qq.type==='mc'&&typeof ans==='number'){
      stored=map[ans];
    }
  }
  _persistAnswer(qId,stored);
}

async function saveMultiAnswer(qId,idx,checked){
  const qq=(activeQuiz.questions||[]).find(x=>x.id===qId);
  const map=qq?.data?._shuffleMap;
  // อ่านค่าเก่า (เก็บเป็น original indices เสมอ)
  const stored=Array.isArray(activeAttempt.answers[qId])?[...activeAttempt.answers[qId]]:[];
  // แปลง idx (shuffled) → original
  const origIdx=map?map[idx]:idx;
  if(checked){
    if(!stored.includes(origIdx))stored.push(origIdx);
  } else {
    const i=stored.indexOf(origIdx);
    if(i>=0)stored.splice(i,1);
  }
  stored.sort((a,b)=>a-b);
  // เซฟตรงๆ (ไม่ต้องแปลงอีก)
  _persistAnswer(qId,stored);
}

async function saveClozeAnswer(qId,idx,value){
  const cur=Array.isArray(activeAttempt.answers[qId])?[...activeAttempt.answers[qId]]:[];
  cur[idx]=value;
  // cloze ไม่มี shuffle → save ตรงๆ
  _persistAnswer(qId,cur);
}

// ── match ──
function _matchClickLeft(qId,li){
  activeAttempt._matchSelLeft=li;
  activeAttempt._matchQid=qId;
  renderTakeQuiz();
}
function _matchClickRight(qId,ri){
  const li=activeAttempt._matchSelLeft;
  if(li===undefined||activeAttempt._matchQid!==qId){showToast('กดฝั่งซ้ายก่อน');return;}
  const cur=activeAttempt.answers[qId]&&typeof activeAttempt.answers[qId]==='object'?{...activeAttempt.answers[qId]}:{};
  // ถ้า ri ถูกจับกับ leftIdx อื่นอยู่ → ปลดออก
  Object.keys(cur).forEach(k=>{if(parseInt(cur[k])===ri)delete cur[k];});
  cur[li]=ri;
  activeAttempt._matchSelLeft=undefined;
  _persistAnswer(qId,cur);
  renderTakeQuiz();
}
function _matchReset(qId){
  activeAttempt._matchSelLeft=undefined;
  _persistAnswer(qId,{});
  renderTakeQuiz();
}

// ── order ──
function _orderMove(qId,pos,dir){
  const cur=Array.isArray(activeAttempt.answers[qId])?[...activeAttempt.answers[qId]]:[];
  const newPos=pos+dir;
  if(newPos<0||newPos>=cur.length)return;
  [cur[pos],cur[newPos]]=[cur[newPos],cur[pos]];
  _persistAnswer(qId,cur);
  renderTakeQuiz();
}

// ── wordbank ──
function _wbPickWord(qId,word){
  const qq=(activeQuiz.questions||[]).find(x=>x.id===qId);
  const nBlanks=(qq?.data?.answers||[]).length;
  const cur=Array.isArray(activeAttempt.answers[qId])?[...activeAttempt.answers[qId]]:new Array(nBlanks).fill('');
  // หา blank แรกที่ยังว่าง
  const emptyIdx=cur.findIndex(x=>!x);
  if(emptyIdx===-1){showToast('เต็มแล้ว — กดช่องเพื่อลบก่อน');return;}
  cur[emptyIdx]=word;
  _persistAnswer(qId,cur);
  renderTakeQuiz();
}
function _wbClearBlank(qId,idx){
  const cur=Array.isArray(activeAttempt.answers[qId])?[...activeAttempt.answers[qId]]:[];
  cur[idx]='';
  _persistAnswer(qId,cur);
  renderTakeQuiz();
}

// ── categorize ──
function _catClickItem(qId,idx){
  if(activeAttempt._catSelCat!==undefined&&activeAttempt._catQid===qId){
    // Cat already selected → assign
    _catAssign(qId,idx,activeAttempt._catSelCat);
    activeAttempt._catSelCat=undefined;
    return;
  }
  activeAttempt._catSelIdx=idx;
  activeAttempt._catQid=qId;
  renderTakeQuiz();
}
function _catClickCat(qId,ci){
  if(activeAttempt._catSelIdx!==undefined&&activeAttempt._catQid===qId){
    _catAssign(qId,activeAttempt._catSelIdx,ci);
    activeAttempt._catSelIdx=undefined;
    return;
  }
  activeAttempt._catSelCat=ci;
  activeAttempt._catQid=qId;
  renderTakeQuiz();
}
function _catAssign(qId,itemIdx,catIdx){
  const qq=(activeQuiz.questions||[]).find(x=>x.id===qId);
  const n=(qq?.data?.items||[]).length;
  const cur=Array.isArray(activeAttempt.answers[qId])?[...activeAttempt.answers[qId]]:new Array(n).fill(-1);
  cur[itemIdx]=catIdx;
  _persistAnswer(qId,cur);
  renderTakeQuiz();
}
function _catUnassign(qId,itemIdx){
  const cur=Array.isArray(activeAttempt.answers[qId])?[...activeAttempt.answers[qId]]:[];
  cur[itemIdx]=-1;
  _persistAnswer(qId,cur);
  renderTakeQuiz();
}

function _updateProgressCounter(){
  const total=(activeQuiz.questions||[]).length;
  const answered=Object.keys(activeAttempt.answers||{}).filter(k=>{
    const v=activeAttempt.answers[k];
    if(v===undefined||v===null||v==='')return false;
    if(Array.isArray(v)&&!v.length)return false;
    if(Array.isArray(v)&&v.every(x=>x===undefined||x===null||x===''))return false;
    return true;
  }).length;
  const el=document.getElementById('qzProgress');
  if(el)el.textContent=`ตอบแล้ว ${answered}/${total}`;
  const btn=document.getElementById('qzSubmitBtn');
  if(btn)btn.innerHTML=`<i class="ti ti-send"></i> ส่งข้อสอบ (ตอบแล้ว ${answered}/${total})`;
}

// ── Anti-cheat: ตรวจจับการออก tab ──
let _cheatCount=0;
let _cheatHandler=null;
let _cheatLastHidden=0;
function _setupAntiCheat(){
  _cheatCount=0;
  _cheatLastHidden=0;
  _cheatHandler=()=>{
    if(!document.hidden)return;
    if(!activeQuiz||!activeAttempt||activeAttempt.status!=='in_progress')return;
    const now=Date.now();
    // Debounce: ไม่นับซ้ำใน 3 วิ (บางเบราว์เซอร์ trigger visibilitychange หลายรอบจาก minor events)
    if(now-_cheatLastHidden<3000)return;
    _cheatLastHidden=now;
    _cheatCount++;
    if(_cheatCount>=3){
      alert('⚠️ คุณออกจากหน้าข้อสอบ 3 ครั้ง\nระบบจะส่งข้อสอบอัตโนมัติ');
      submitQuiz(true);
    } else {
      setTimeout(()=>{
        alert(`⚠️ กรุณาอย่าออกจากหน้าข้อสอบ\n(เตือน ${_cheatCount}/3 — ถ้าครบ 3 ครั้งจะส่งข้อสอบอัตโนมัติ)`);
      },500);
    }
  };
  document.addEventListener('visibilitychange',_cheatHandler);
}
function _teardownAntiCheat(){
  if(_cheatHandler){
    document.removeEventListener('visibilitychange',_cheatHandler);
    _cheatHandler=null;
  }
  _cheatCount=0;
  _cheatLastHidden=0;
}

// ── ส่งข้อสอบ + Auto-grade ──
async function submitQuiz(isTimeout){
  const qs=activeQuiz.questions||[];
  const answered=Object.keys(activeAttempt.answers).length;
  if(!isTimeout){
    const unanswered=qs.length-answered;
    let msg='ยืนยันส่งข้อสอบ?\n\n';
    msg+=`ตอบแล้ว: ${answered}/${qs.length} ข้อ\n`;
    if(unanswered>0)msg+=`⚠️ มีอีก ${unanswered} ข้อที่ยังไม่ตอบ\n`;
    msg+=`\nหลังกดส่งจะแก้ไขคำตอบไม่ได้`;
    if(!confirm(msg))return;
  }
  // Auto-grade
  let rawScore=0,maxScore=0,hasEssay=false;
  qs.forEach(qq=>{
    maxScore+=parseFloat(qq.points)||0;
    const ans=activeAttempt.answers[qq.id];
    if(ans===undefined||ans===null||ans==='')return;
    // ถ้ามี shuffle map → correct ที่เก็บใน qq.data.correct เป็น shuffled index
    // แต่ ans ที่บันทึกคือ original index → ต้อง compute original correct
    const map=qq.data?._shuffleMap;
    if(qq.type==='mc'){
      // original correct = map[qq.data.correct] (สังเกต: qq.data.correct = shuffled idx)
      const origCorrect=map?map[qq.data.correct]:qq.data?.correct;
      if(parseInt(ans)===origCorrect)rawScore+=parseFloat(qq.points)||0;
    } else if(qq.type==='multi'){
      const shufCorrect=qq.data?.correct||[];
      const origCorrect=map?shufCorrect.map(c=>map[c]).sort((a,b)=>a-b):shufCorrect;
      const given=Array.isArray(ans)?[...ans].sort((a,b)=>a-b):[];
      if(origCorrect.length===given.length&&origCorrect.every(c=>given.includes(c))){
        rawScore+=parseFloat(qq.points)||0;
      }
    } else if(qq.type==='tf'){
      if(ans===qq.data?.correct)rawScore+=parseFloat(qq.points)||0;
    } else if(qq.type==='fill'){
      const correct=qq.data?.answers||[];
      const cleaned=(''+ans).trim().toLowerCase();
      if(correct.some(c=>(''+c).trim().toLowerCase()===cleaned))rawScore+=parseFloat(qq.points)||0;
    } else if(qq.type==='cloze'){
      // แต่ละช่องให้คะแนนเท่าๆ กัน
      const blanks=qq.data?.blanks||[];
      const userAns=Array.isArray(ans)?ans:[];
      if(blanks.length){
        const perBlank=(parseFloat(qq.points)||0)/blanks.length;
        blanks.forEach((b,idx)=>{
          const u=(userAns[idx]||'').trim().toLowerCase();
          if(!u)return;
          const ok=(b.answers||[]).some(x=>(''+x).trim().toLowerCase()===u);
          if(ok)rawScore+=perBlank;
        });
      }
    } else if(qq.type==='essay'){
      hasEssay=true;
      // Essay ไม่ตรวจอัตโนมัติ ครูให้คะแนนเอง
    } else if(qq.type==='match'){
      const pairs=qq.data?.pairs||[];
      const userMap=ans&&typeof ans==='object'&&!Array.isArray(ans)?ans:{};
      if(pairs.length){
        const perPair=(parseFloat(qq.points)||0)/pairs.length;
        pairs.forEach((p,i)=>{
          if(parseInt(userMap[i])===i)rawScore+=perPair;
        });
      }
    } else if(qq.type==='order'){
      const items=qq.data?.items||[];
      const given=Array.isArray(ans)?ans:[];
      if(items.length){
        // เต็มคะแนนเมื่อเรียงถูกทั้งหมด
        if(items.every((it,i)=>parseInt(given[i])===i)){
          rawScore+=parseFloat(qq.points)||0;
        }
      }
    } else if(qq.type==='wordbank'){
      const answers=qq.data?.answers||[];
      const given=Array.isArray(ans)?ans:[];
      if(answers.length){
        const perBlank=(parseFloat(qq.points)||0)/answers.length;
        answers.forEach((a,idx)=>{
          const u=(given[idx]||'').trim().toLowerCase();
          if(u&&u===(''+a).trim().toLowerCase())rawScore+=perBlank;
        });
      }
    } else if(qq.type==='categorize'){
      const items=qq.data?.items||[];
      const given=Array.isArray(ans)?ans:[];
      if(items.length){
        const perItem=(parseFloat(qq.points)||0)/items.length;
        items.forEach((it,i)=>{
          if(parseInt(given[i])===parseInt(it.cat))rawScore+=perItem;
        });
      }
    }
  });
  try{
    if(quizTimer){clearInterval(quizTimer);quizTimer=null;}
    _teardownAntiCheat();
    const newStatus=hasEssay?'submitted':'graded';
    const {error}=await sb.from('quiz_attempts').update({
      status:newStatus,
      submitted_at:new Date().toISOString(),
      answers:activeAttempt.answers,
      raw_score:rawScore,
      total_score:rawScore,
      max_score:maxScore
    }).eq('id',activeAttempt.id);
    if(error)throw error;
    _lastSaveTimeStu=Date.now();

    // แบบฝึกทำ: บันทึกเข้า "งานติดตามการส่ง" ทันที เพื่อให้ครูเห็นว่าใครทำแล้ว/ยังไม่ทำ
    if(activeQuiz && activeQuiz.score_target==='none'){
      await _markPracticeQuizDone(activeQuiz);
    }

    // ส่งคะแนนเข้าระบบเกรด (เฉพาะถ้าไม่มี essay เพราะยังไม่ตรวจครบ)
    if(!hasEssay){
      await _sendQuizScoreToGrade(activeQuiz,rawScore,maxScore);
    }

    activeAttempt.status=newStatus;
    activeAttempt.total_score=rawScore;
    activeAttempt.max_score=maxScore;
    stuAttempts[activeQuiz.id]=activeAttempt;
    activeQuiz=null;
    activeAttempt=null;
    // แสดงผลลัพธ์
    const pct=maxScore>0?Math.round(rawScore/maxScore*100):0;
    let msg=`ส่งข้อสอบสำเร็จ ✓\n\n`;
    if(hasEssay){
      msg+=`คะแนน auto-grade: ${fmtScore(rawScore)} / ${fmtScore(maxScore)}\n(รอครูตรวจข้อเขียนตอบเพิ่มเติม)`;
    } else {
      msg+=`คะแนน: ${fmtScore(rawScore)} / ${fmtScore(maxScore)} (${pct}%)`;
    }
    alert(msg);
    await loadStuQuizzes();
    renderStuQuiz();
  }catch(e){console.error(e);alert('ส่งไม่สำเร็จ: '+e.message);}
}

// v14.4: สร้างงานคะแนนจากข้อสอบแบบ canonical และรวม legacy ไม่ให้เกิดคอลัมน์ซ้ำ
async function _ensureStudentQuizAssignment(quiz,cid,subid){
  const canonical='asg_qz_'+quiz.id+'_'+cid;
  const legacy='asg_qz_'+quiz.id;
  const row={id:canonical,class_id:cid,subject_id:subid,name:'[ข้อสอบ] '+quiz.title,max_score:quiz.max_score,type:'score'};
  const {error}=await sb.from('assignments').upsert(row,{onConflict:'id'});
  if(error)throw error;
  // ถ้ามีรายการรุ่นเก่า ย้ายคะแนนเดิมก่อนลบ เพื่อไม่ให้สูญหาย
  const {data:oldScores}=await sb.from('scores').select('student_id,value').eq('assignment_id',legacy);
  if(oldScores&&oldScores.length){
    await sb.from('scores').upsert(oldScores.map(x=>({assignment_id:canonical,student_id:x.student_id,value:x.value})),{onConflict:'assignment_id,student_id'});
  }
  await sb.from('assignments').delete().eq('id',legacy);
  return canonical;
}

// ── ส่งคะแนนเข้าระบบเกรด ──
async function _sendQuizScoreToGrade(quiz,rawScore,maxScore){
  _lastSaveTimeStu=Date.now();  const target=quiz.score_target;
  if(target==='none')return;
  const finalScore=maxScore>0?(rawScore/maxScore)*quiz.max_score:0;
  const scoreRounded=Math.round(finalScore*10)/10;
  const sid=me.studentId;
  // หา class+subject ที่ตรงกับห้องของนักเรียน (รองรับ multi-class assignment)
  const assignedList=quiz.assigned_classes||[];
  const myAssign=assignedList.find(a=>a.class_id===me.classId);
  const cid=myAssign?myAssign.class_id:quiz.class_id;
  const subid=myAssign?myAssign.subject_id:quiz.subject_id;
  if(target==='assignment'){
    // ใช้ assignment canonical เดียวต่อข้อสอบ/ห้อง ป้องกันคอลัมน์ซ้ำ
    const asgId=await _ensureStudentQuizAssignment(quiz,cid,subid);
    await sb.from('scores').upsert({
      assignment_id:asgId, student_id:sid, value:String(scoreRounded)
    },{onConflict:'assignment_id,student_id'});
  } else if(target==='mid'||target==='final'){
    const col=target==='mid'?'mid_score':'final_score';
    const row={subject_id:subid,student_id:sid};row[col]=scoreRounded;
    await sb.from('exam_scores').upsert(row,{onConflict:'subject_id,student_id'});
  }
}

// ── ดูเฉลยหลังทำเสร็จ ──
function viewQuizResult(quizId){
  const q=stuQuizData[quizId];

  const pct=a.max_score>0?Math.round(a.total_score/a.max_score*100):0;

  let html=`
    <div style="padding:12px">
      <button class="btn" onclick="renderStuQuiz()"><i class="ti ti-arrow-left"></i> กลับ</button>
      <div style="background:${pct>=60?'#F0FDF4':'#FEF2F2'};border:1.5px solid ${pct>=60?'var(--gn)':'var(--rd)'};border-radius:10px;padding:14px;margin:12px 0">
        <div style="font-weight:700;font-size:15px;margin-bottom:4px">${q.title}</div>
        <div style="font-size:13px;color:var(--mu)">คะแนน: <b style="color:${pct>=60?'var(--gn)':'var(--rd)'};font-size:16px">${fmtScore(a.total_score)} / ${fmtScore(a.max_score)}</b> (${pct}%)</div>
      </div>`;

  if(!showAns){
    html+=`<div class="empty"><i class="ti ti-lock"></i><div>ยังไม่แสดงเฉลย</div><p>รอครูปิดข้อสอบก่อน</p></div>`;
  } else {
    // Merge questions + passages by order_num (เหมือน renderTakeQuiz)
    const passages=q.passages||[];
    const items=[];
    qs.forEach(x=>items.push({kind:'q',order:x.order_num||0,data:x}));
    passages.forEach(x=>items.push({kind:'p',order:x.order_num||0,data:x}));
    items.sort((a,b)=>a.order-b.order);
    let qNum=0;
    items.forEach(it=>{
      if(it.kind==='p'){
        const p=it.data;
        html+=`<div style="background:#F0F9FF;border:1.5px solid #93C5FD;border-radius:10px;padding:12px;margin-bottom:8px">
          <div style="font-weight:700;font-size:13px;color:#1E40AF;margin-bottom:6px"><i class="ti ti-book"></i> ${p.title||'ส่วนหัว'}</div>
          ${p.content_text?`<div style="font-size:13px;line-height:1.6;padding:8px;background:#fff;border-radius:6px;white-space:pre-wrap">${(p.content_text||'').replace(/</g,'&lt;')}</div>`:''}
          ${p.image_url?`<img src="${p.image_url}" style="max-width:100%;max-height:220px;border-radius:6px;margin-top:6px;border:1px solid var(--bd)">`:''}
        </div>`;
        return;
      }
      qNum++;
      const qq=it.data;
      const i=qNum-1;
      const ans=a.answers?.[qq.id];
      const qImgHtml=qq.image_url?`<div style="margin:6px 0"><img src="${qq.image_url}" style="max-width:100%;max-height:200px;border-radius:6px;border:1px solid var(--bd)"></div>`:'';
      const optImgs=qq.option_images||[];
      let correct=false, ansDisplay='', corDisplay='', isEssay=false;
      if(qq.type==='mc'){
        correct=parseInt(ans)===qq.data?.correct;
        const opts=qq.data?.options||[];
        const ansIdx=ans!==undefined?ans:-1;
        ansDisplay=ansIdx>=0?(opts[ansIdx]||'-')+(optImgs[ansIdx]?` <img src="${optImgs[ansIdx]}" style="max-width:60px;max-height:45px;vertical-align:middle;border-radius:3px">`:''):'ไม่ตอบ';
        const cor=qq.data?.correct;
        corDisplay=(opts[cor]||'-')+(optImgs[cor]?` <img src="${optImgs[cor]}" style="max-width:60px;max-height:45px;vertical-align:middle;border-radius:3px">`:'');
      } else if(qq.type==='multi'){
        const cor=qq.data?.correct||[];
        const given=Array.isArray(ans)?ans:[];
        correct=cor.length===given.length&&cor.every(c=>given.includes(c));
        const opts=qq.data?.options||[];
        ansDisplay=given.length?given.map(i=>(opts[i]||'-')+(optImgs[i]?` <img src="${optImgs[i]}" style="max-width:50px;max-height:38px;vertical-align:middle;border-radius:3px">`:'')).join(', '):'ไม่ตอบ';
        corDisplay=cor.map(i=>(opts[i]||'-')+(optImgs[i]?` <img src="${optImgs[i]}" style="max-width:50px;max-height:38px;vertical-align:middle;border-radius:3px">`:'')).join(', ');
      } else if(qq.type==='tf'){
        correct=ans===qq.data?.correct;
        ansDisplay=ans===true?'ถูก':(ans===false?'ผิด':'ไม่ตอบ');
        corDisplay=qq.data?.correct?'ถูก':'ผิด';
      } else if(qq.type==='fill'){
        const cleaned=(''+ans).trim().toLowerCase();
        correct=(qq.data?.answers||[]).some(c=>(''+c).trim().toLowerCase()===cleaned);
        ansDisplay=ans||'ไม่ตอบ';
        corDisplay=(qq.data?.answers||[]).join(' / ');
      } else if(qq.type==='cloze'){
        const blanks=qq.data?.blanks||[];
        const userAns=Array.isArray(ans)?ans:[];
        let allCorrect=true;
        blanks.forEach((b,idx)=>{
          const u=(userAns[idx]||'').trim().toLowerCase();
          const ok=(b.answers||[]).some(x=>(''+x).trim().toLowerCase()===u);
          if(!ok)allCorrect=false;
        });
        correct=allCorrect;
        ansDisplay=userAns.map(u=>u||'?').join(' | ');
        corDisplay=blanks.map(b=>(b.answers||[]).join('/')).join(' | ');
      } else if(qq.type==='essay'){
        isEssay=true;
        ansDisplay=(ans||'').replace(/</g,'&lt;').replace(/\n/g,'<br>')||'<i>ไม่ตอบ</i>';
      } else if(qq.type==='match'){
        const pairs=qq.data?.pairs||[];
        const um=ans&&typeof ans==='object'&&!Array.isArray(ans)?ans:{};
        correct=pairs.every((p,idx)=>parseInt(um[idx])===idx);
        ansDisplay=pairs.map((p,idx)=>{
          const uIdx=um[idx];const uRight=uIdx!==undefined&&pairs[uIdx]?pairs[uIdx].right:'?';
          const ok=parseInt(uIdx)===idx;
          return `<b>${p.left}</b> ↔ ${ok?'<span style="color:#059669">'+uRight+' ✓</span>':'<span style="color:#dc2626">'+uRight+' ✗</span>'}`;
        }).join('<br>');
        corDisplay=pairs.map(p=>`<b>${p.left}</b> ↔ ${p.right}`).join('<br>');
      } else if(qq.type==='order'){
        const items=qq.data?.items||[];
        const given=Array.isArray(ans)?ans:[];
        correct=items.every((it,idx)=>parseInt(given[idx])===idx);
        ansDisplay=given.map((idx,pos)=>{
          const ok=parseInt(idx)===pos;
          return `${pos+1}. ${ok?'<span style="color:#059669">'+(items[idx]||'?')+' ✓</span>':'<span style="color:#dc2626">'+(items[idx]||'?')+' ✗</span>'}`;
        }).join('<br>');
        corDisplay=items.map((it,i)=>`${i+1}. ${it}`).join('<br>');
      } else if(qq.type==='wordbank'){
        const answers=qq.data?.answers||[];
        const given=Array.isArray(ans)?ans:[];
        correct=answers.every((a,i)=>(given[i]||'').trim().toLowerCase()===(''+a).trim().toLowerCase());
        ansDisplay=given.map((v,i)=>{
          const ok=(v||'').trim().toLowerCase()===(''+(answers[i]||'')).trim().toLowerCase();
          return `[${i+1}] ${ok?'<span style="color:#059669">'+(v||'?')+' ✓</span>':'<span style="color:#dc2626">'+(v||'?')+' ✗</span>'}`;
        }).join(' · ');
        corDisplay=answers.map((a,i)=>`[${i+1}] ${a}`).join(' · ');
      } else if(qq.type==='categorize'){
        const cats=qq.data?.categories||[];
        const items=qq.data?.items||[];
        const given=Array.isArray(ans)?ans:[];
        correct=items.every((it,idx)=>parseInt(given[idx])===parseInt(it.cat));
        ansDisplay=items.map((it,idx)=>{
          const gCat=given[idx]!==undefined&&given[idx]>=0?cats[given[idx]]||'?':'(ไม่จัด)';
          const ok=parseInt(given[idx])===parseInt(it.cat);
          return `${it.name}: ${ok?'<span style="color:#059669">'+gCat+' ✓</span>':'<span style="color:#dc2626">'+gCat+' ✗</span>'}`;
        }).join('<br>');
        corDisplay=items.map(it=>`${it.name}: ${cats[it.cat]||'?'}`).join('<br>');
      }
      const borderCol=isEssay?'var(--am)':(correct?'var(--gn)':'var(--rd)');
      html+=`
        <div style="background:#fff;border:1.5px solid ${borderCol};border-radius:10px;padding:12px;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="background:var(--tl);color:#fff;font-size:11px;padding:1px 8px;border-radius:6px">ข้อ ${i+1}</span>
            ${isEssay?'<span style="font-size:11px;color:var(--am);font-weight:700"><i class="ti ti-pencil"></i> ครูตรวจให้คะแนนเอง</span>':(correct?'<span style="font-size:11px;color:var(--gn);font-weight:700"><i class="ti ti-check"></i> ถูก</span>':'<span style="font-size:11px;color:var(--rd);font-weight:700"><i class="ti ti-x"></i> ผิด</span>')}
            <span style="font-size:11px;color:var(--mu);margin-left:auto">${qq.points} คะแนน</span>
          </div>
          <div style="font-size:13.5px;font-weight:600;margin-bottom:6px">${qq.question}</div>
          ${qImgHtml}
          <div style="font-size:12.5px;padding:6px 8px;background:${isEssay?'#FEF3C7':(correct?'#F0FDF4':'#FEF2F2')};border-radius:6px;margin-top:4px">
            <b>คำตอบของคุณ:</b> ${ansDisplay}
          </div>
          ${(!correct&&!isEssay)?`<div style="font-size:12.5px;padding:6px 8px;background:#EFF6FF;border-radius:6px;margin-top:4px">
            <b>เฉลย:</b> ${corDisplay}
          </div>`:''}
        </div>`;
    });
  }
  html+=`</div>`;
  document.getElementById('mainContent').innerHTML=html;
}

/* ── ASSIGNMENTS ── */
function renderAssignments(){
  const cid=me.classId,sid=me.studentId;
  const subs=subArr(cid);
  if(!currentSubject||!subs.find(s=>s.id===currentSubject))currentSubject=subs[0]?.id||null;

  let html=``;
  if(subs.length>1){
    html+=`<div class="sub-tabs">`;
    subs.forEach(sub=>{html+=`<button class="sub-tab${sub.id===currentSubject?' active':''}" onclick="currentSubject='${sub.id}';renderAssignments()">${sub.name}</button>`;});
    html+=`</div>`;
  }
  if(!currentSubject){document.getElementById('mainContent').innerHTML=html+`<div class="card"><div class="empty"><i class="ti ti-book-off"></i><div>ยังไม่มีวิชา</div></div></div>`;return;}

  const sub=subs.find(s=>s.id===currentSubject);
  const asgs=(asgBlock(cid)[currentSubject])||[];

  // คำนวณสถานะแต่ละงาน
  function statusOf(a){
    const v=((scBlock(cid)[currentSubject]||{})[a.id]||{})[sid];
    if(a.type==='track'){
      if(v==='ตรงเวลา')return 'ontime';
      if(v==='ส่งช้า')return 'late';
      return 'none';
    } else {
      const has=(v!==undefined&&v!==''&&!isNaN(parseFloat(v)));
      return has?'ontime':'none';
    }
  }

  let cOntime=0,cLate=0,cNone=0;
  asgs.forEach(a=>{const st=statusOf(a);if(st==='ontime')cOntime++;else if(st==='late')cLate++;else cNone++;});
  const cSent=cOntime+cLate;

  html+=`<div class="sg">
    <div class="sc"><div class="sl">งานทั้งหมด</div><div class="sv" style="color:var(--tl)">${asgs.length}</div></div>
    <div class="sc"><div class="sl">ส่งแล้ว</div><div class="sv" style="color:var(--gn)">${cSent}</div></div>
    <div class="sc"><div class="sl">ส่งช้า</div><div class="sv" style="color:var(--or)">${cLate}</div></div>
    <div class="sc"><div class="sl">ยังไม่ส่ง</div><div class="sv" style="color:var(--rd)">${cNone}</div></div>
  </div>`;

  // ตัวกรองงาน: งานทั้งหมด / ส่งแล้ว / ยังไม่ส่ง
  html+=`<div class="score-type-bar" style="margin-bottom:14px">
    <button class="score-type-btn${assignmentView==='all'?' active':''}" onclick="assignmentView='all';renderAssignments()"><i class="ti ti-list"></i> งานทั้งหมด <span style="margin-left:4px;opacity:.85">${asgs.length}</span></button>
    <button class="score-type-btn${assignmentView==='sent'?' active':''}" onclick="assignmentView='sent';renderAssignments()"><i class="ti ti-circle-check"></i> ส่งแล้ว <span style="margin-left:4px;opacity:.85">${cSent}</span></button>
    <button class="score-type-btn${assignmentView==='unsent'?' active':''}" onclick="assignmentView='unsent';renderAssignments()"><i class="ti ti-clock-exclamation"></i> ยังไม่ส่ง <span style="margin-left:4px;opacity:.85">${cNone}</span></button>
  </div>`;

  if(!asgs.length){
    html+=`<div class="card"><div class="empty"><i class="ti ti-clipboard-list"></i><div>ยังไม่มีงาน</div><p>รอครูสั่งงาน</p></div></div>`;
    document.getElementById('mainContent').innerHTML=html;return;
  }

  const filtered=asgs.filter(a=>{
    const st=statusOf(a);
    if(assignmentView==='sent')return st==='ontime'||st==='late';
    if(assignmentView==='unsent')return st==='none';
    return true;
  });

  const sorted=filtered.slice().sort((a,b)=>{
    if(a.dueDate&&b.dueDate)return a.dueDate.localeCompare(b.dueDate);
    if(a.dueDate)return -1;if(b.dueDate)return 1;return 0;
  });

  const viewTitle=assignmentView==='sent'?'งานที่ส่งแล้ว':assignmentView==='unsent'?'งานที่ยังไม่ส่ง':'งานทั้งหมด';
  if(!sorted.length){
    const msg=assignmentView==='sent'?'ยังไม่มีงานที่ส่งแล้ว':assignmentView==='unsent'?'ไม่มีงานค้างส่ง':'ยังไม่มีงาน';
    const icon=assignmentView==='unsent'?'ti-circle-check':'ti-clipboard-list';
    html+=`<div class="card"><div class="empty"><i class="ti ${icon}"></i><div>${msg}</div></div></div>`;
    document.getElementById('mainContent').innerHTML=html;return;
  }

  html+=`<div class="card"><div class="card-hd"><div class="card-hd-title">${viewTitle} (${sorted.length} งาน)</div></div><div class="card-bd" style="padding:0">`;
  sorted.forEach(a=>{
    const st=statusOf(a);
    // ── สถานะไฟล์ที่ส่ง (ถ้ามี submission) ──
    const sub=stuSubs[a.id];
    let submitLine='';
    if(sub){
      const nFiles=(sub.files||[]).length;
      if(sub.status==='reviewed'){
        submitLine=`<div style="font-size:11.5px;color:var(--gn);margin-top:2px"><i class="ti ti-check-circle"></i> ครูตรวจแล้ว · ${nFiles} ไฟล์</div>`;
        if(sub.teacher_note){
          submitLine+=`<div style="margin-top:4px;background:#EFF6FF;border-left:3px solid var(--bl);padding:5px 8px;border-radius:4px;font-size:11.5px;color:#1E40AF"><b>โน้ตครู:</b> ${sub.teacher_note}</div>`;
        }
      } else {
        submitLine=`<div style="font-size:11.5px;color:var(--am);margin-top:2px"><i class="ti ti-clock"></i> รอครูตรวจ · ${nFiles} ไฟล์</div>`;
      }
    }
    let badge,bcol;
    if(st==='ontime'){badge='<span class="badge bg"><i class="ti ti-check"></i> ส่งแล้ว</span>';bcol='var(--gn)';}
    else if(st==='late'){badge='<span class="badge bo"><i class="ti ti-clock-exclamation"></i> ส่งช้า</span>';bcol='var(--or)';}
    else{badge='<span class="badge br"><i class="ti ti-x"></i> ยังไม่ส่ง</span>';bcol='var(--rd)';}
    const typeTag=(a.type==='track')?'<span style="font-size:10px;color:var(--or);background:var(--orl);padding:1px 6px;border-radius:8px;margin-left:6px">ติดตาม</span>':'';
    const fileTag=a.allowFileSubmit?'<span style="font-size:10px;color:#15803D;background:#DCFCE7;padding:1px 6px;border-radius:8px;margin-left:4px"><i class="ti ti-upload"></i> รับไฟล์</span>':'';
    const dueTag=a.dueDate?`<div style="font-size:11.5px;color:var(--mu);margin-top:2px"><i class="ti ti-calendar"></i> กำหนดส่ง: ${thDate(a.dueDate)}</div>`:'';
    // ── ปุ่มส่งไฟล์ ──
    let uploadBtn='';
    if(a.allowFileSubmit){
      if(sub&&sub.status==='reviewed'){
        uploadBtn=`<button class="btn btn-xs" onclick="viewMySubmission(${sub.id},'${a.name.replace(/'/g,'\\\'').replace(/"/g,'&quot;')}')"><i class="ti ti-eye"></i> ดูไฟล์</button>`;
      } else {
        uploadBtn=`<button class="btn btn-xs btn-p" onclick="openSubmitFile('${a.id}','${a.name.replace(/'/g,'\\\'').replace(/"/g,'&quot;')}')"><i class="ti ti-upload"></i> ${sub?'เพิ่ม/แก้ไข':'ส่งไฟล์'}</button>`;
      }
    }
    html+=`<div style="padding:12px 14px;border-bottom:1px solid var(--bd);border-left:4px solid ${bcol}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="flex:1"><div style="font-weight:600">${a.name}${typeTag}${fileTag}</div>${dueTag}${submitLine}</div>
        <div style="flex-shrink:0;display:flex;flex-direction:column;gap:6px;align-items:flex-end">${badge}${uploadBtn}</div>
      </div>
    </div>`;
  });
  html+=`</div></div>`;

  document.getElementById('mainContent').innerHTML=html;
}

let stuSubs={}; // {asgId: {id, status, teacher_note, files:[]}}

async function refreshAssignmentsFresh(){
  if(!me)return;
  try{
    const {data:asgs,error}=await sb.from('assignments').select('id,class_id,subject_id,name,max_score,type,due_date,allow_file_submit');
    if(error){console.error('refresh assignments:',error);return;}
    // อัปเดต db.assignments ตาม data ใหม่จาก Supabase
    // (ลบของเก่าออก แล้วใส่ใหม่ทั้งหมด เฉพาะ table นี้)
    const cid2term={};
    (db.classes||[]).forEach(c=>{cid2term[c.id]=c.termId||'';});
    const newAsgs={};
    (asgs||[]).forEach(a=>{
      const tkey=(cid2term[a.class_id]||'')+'__'+a.class_id;
      if(!newAsgs[tkey])newAsgs[tkey]={};
      if(!newAsgs[tkey][a.subject_id])newAsgs[tkey][a.subject_id]=[];
      newAsgs[tkey][a.subject_id].push({
        id:a.id,name:a.name,maxScore:a.max_score,type:a.type||'score',
        dueDate:a.due_date||'',allowFileSubmit:!!a.allow_file_submit
      });
    });
    db.assignments=newAsgs;
    console.log('[refreshAssignments] Loaded',asgs?.length||0,'assignments');
  }catch(e){console.error('refreshAssignmentsFresh:',e);}
}

async function loadMySubmissions(){
  if(!me)return;
  try{
    const {data:subs,error}=await sb.from('submissions').select('*').eq('student_id',me.studentId);
    if(error){console.error('load subs:',error);return;}
    const subIds=(subs||[]).map(s=>s.id);
    let files=[];
    if(subIds.length){
      const {data:f}=await sb.from('submission_files').select('*').in('submission_id',subIds);
      files=f||[];
    }
    stuSubs={};
    (subs||[]).forEach(s=>{
      stuSubs[s.assignment_id]={
        id:s.id, status:s.status||'pending',
        teacher_note:s.teacher_note||'',
        files:files.filter(f=>f.submission_id===s.id)
      };
    });
  }catch(e){console.error('loadMySubmissions:',e);}
}

const ALLOWED_MIMES=['image/jpeg','image/png','image/heic','image/heif','image/webp','application/pdf','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/msword','application/vnd.ms-excel'];
const MAX_FILE_SIZE=5*1024*1024; // 5 MB

function openSubmitFile(asgId,asgName){
  const sub=stuSubs[asgId];
  const files=sub?sub.files||[]:[];
  const rows=files.map(f=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--sf2);border-radius:6px;margin-bottom:4px">
      <div style="flex:1;overflow:hidden">
        <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.file_name}</div>
        <div style="font-size:10.5px;color:var(--mu)">${Math.round(f.file_size/1024)} KB</div>
      </div>
      <button class="btn btn-xs" style="color:var(--rd);border-color:var(--rd)" onclick="delMyFile(${f.id},'${asgId}','${asgName.replace(/'/g,'\\\'').replace(/"/g,'&quot;')}')"><i class="ti ti-x"></i></button>
    </div>`).join('');
  showMD(`<div class="mt">ส่งไฟล์งาน</div>
    <div style="padding:10px;background:#EFF6FF;border-radius:6px;margin-bottom:14px;font-size:12.5px">
      <b>${asgName}</b>
    </div>
    <div style="font-weight:700;font-size:13px;margin-bottom:6px">ไฟล์ที่ส่งแล้ว (${files.length})</div>
    <div style="max-height:180px;overflow:auto;margin-bottom:14px">
      ${files.length?rows:'<div style="padding:12px;background:var(--sf2);border-radius:6px;text-align:center;font-size:12px;color:var(--mu)">ยังไม่มีไฟล์</div>'}
    </div>
    <div class="fg">
      <label class="fl"><i class="ti ti-file-upload"></i> เลือกไฟล์ (รูป / PDF / Word / Excel — ขนาด ≤ 5 MB)</label>
      <input type="file" id="mySubFile" accept=".jpg,.jpeg,.png,.heic,.heif,.webp,.pdf,.doc,.docx,.xls,.xlsx,image/*,application/pdf" multiple>
      <div id="mySubProgress" style="font-size:11.5px;color:var(--mu);margin-top:6px"></div>
    </div>
    <div class="f g8" style="justify-content:flex-end;margin-top:10px">
      <button class="btn" onclick="closeMD()">ปิด</button>
      <button class="btn btn-p" onclick="uploadMyFiles('${asgId}','${asgName.replace(/'/g,'\\\'').replace(/"/g,'&quot;')}')"><i class="ti ti-upload"></i>อัปโหลด</button>
    </div>
  `);
}

async function uploadMyFiles(asgId,asgName){
  const inp=document.getElementById('mySubFile');
  if(!inp||!inp.files||!inp.files.length){showToast('เลือกไฟล์ก่อน');return;}
  const files=[...inp.files];
  const progress=document.getElementById('mySubProgress');
  // ตรวจไฟล์
  for(const f of files){
    if(f.size>MAX_FILE_SIZE){showToast(`ไฟล์ ${f.name} ใหญ่เกิน 5 MB`);return;}
  }
  // 1) หา / สร้าง submission
  let submissionId=stuSubs[asgId]?.id;
  if(!submissionId){
    const {data:inserted,error}=await sb.from('submissions').insert({
      assignment_id:asgId, student_id:me.studentId,
      status:'pending', submitted_at:new Date().toISOString()
    }).select().single();
    if(error){console.error(error);showToast('สร้าง submission ล้มเหลว');return;}
    submissionId=inserted.id;
  } else {
    // reset status เป็น pending อีกครั้ง (ครูอาจต้องดูใหม่)
    await sb.from('submissions').update({status:'pending',submitted_at:new Date().toISOString(),reviewed_at:null}).eq('id',submissionId);
  }
  // 2) upload ไฟล์
  let ok=0,fail=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(progress)progress.textContent=`กำลังอัปโหลด ${i+1}/${files.length} : ${f.name}`;
    const ext=(f.name.split('.').pop()||'bin').toLowerCase();
    const timestamp=Date.now();
    const rand=Math.random().toString(36).slice(2,8);
    const path=`submissions/${submissionId}/${timestamp}_${rand}.${ext}`;
    const {error:upErr}=await sb.storage.from('submissions').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type||'application/octet-stream'});
    if(upErr){console.error('upload err:',upErr);fail++;continue;}
    const {error:metaErr}=await sb.from('submission_files').insert({
      submission_id:submissionId,
      file_name:f.name, file_path:path,
      file_size:f.size, file_type:f.type||''
    });
    if(metaErr){console.error(metaErr);fail++;continue;}
    ok++;
  }
  _lastSaveTimeStu=Date.now();
  if(progress)progress.textContent=`เสร็จสิ้น: อัปโหลด ${ok} ไฟล์${fail?' · ล้มเหลว '+fail:''}`;
  showToast(`✓ อัปโหลด ${ok} ไฟล์${fail?' (ล้มเหลว '+fail+')':''}`);
  await loadMySubmissions();
  closeMD();
  renderAssignments();
}

async function delMyFile(fileId,asgId,asgName){
  _lastSaveTimeStu=Date.now();  if(!confirm('ลบไฟล์นี้?'))return;
  // หา path เพื่อลบใน storage
  const sub=stuSubs[asgId];
  const file=sub?.files?.find(f=>f.id===fileId);
  if(file){
    try{await sb.storage.from('submissions').remove([file.file_path]);}catch(e){console.error(e);}
  }
  await sb.from('submission_files').delete().eq('id',fileId);
  _lastSaveTimeStu=Date.now();
  await loadMySubmissions();
  openSubmitFile(asgId,asgName);
}

function updPwDots(inputId, dotsId){
  const inp=document.getElementById(inputId);const dots=document.getElementById(dotsId);
  if(!inp||!dots)return;
  const len=inp.value.length;const max=6;
  dots.innerHTML=Array.from({length:max},(_,i)=>`<div class="pw-dot${i<len?' filled':''}"></div>`).join('');
}
function togglePwEye(inputId, btn){
  const inp=document.getElementById(inputId);if(!inp)return;
  const show=inp.type==='password';inp.type=show?'text':'password';
  btn.innerHTML=show?'<i class="ti ti-eye-off"></i>':'<i class="ti ti-eye"></i>';
}
function updPwStrength(inputId){
  const pw=document.getElementById(inputId)?.value||'';
  const bar=document.getElementById('regPwBar');const hint=document.getElementById('regPwHint');
  if(!bar||!hint)return;
  let strength=0,msg='';
  if(pw.length>=4)strength++;if(pw.length>=8)strength++;
  if(/[A-Z]/.test(pw)||/[ก-ฮ]/.test(pw))strength++;
  if(/[0-9]/.test(pw))strength++;
  if(/[^a-zA-Z0-9ก-ฮ]/.test(pw))strength++;
  const colors=['#EF4444','#F97316','#EAB308','#22C55E','#16A34A'];
  const labels=['อ่อนมาก','อ่อน','พอใช้','แข็งแกร่ง','แข็งแกร่งมาก'];
  bar.style.width=(strength/5*100)+'%';bar.style.background=colors[strength-1]||'#E5E7EB';
  hint.textContent=pw.length?'ความแข็งแกร่ง: '+(labels[strength-1]||''):' ';
}
function checkPwMatch(){
  const pw=document.getElementById('regPw')?.value||'';
  const pw2=document.getElementById('regPw2')?.value||'';
  const msg=document.getElementById('pwMatchMsg');if(!msg)return;
  if(!pw2){msg.textContent='';return;}
  msg.innerHTML=pw===pw2?'<span style="color:var(--gn)"><i class="ti ti-check"></i> รหัสผ่านตรงกัน</span>':'<span style="color:var(--rd)"><i class="ti ti-x"></i> รหัสผ่านไม่ตรงกัน</span>';
}

// ── เช็คสมาชิก (นักเรียน = หัวหน้ากลุ่ม) ──
function _fsAttKeyStu(cid,gid){return tk(cid)+'__'+gid;}
function _fsAttOfDayStu(cid,gid,date){return (((db.fiveS.attendance||{})[_fsAttKeyStu(cid,gid)]||{})[date])||{};}
function fsActiveRoundStu(cid){
  const rounds=(db.fiveS.rounds||{})[tk(cid)]||[];
  return rounds.find(r=>r.status==='active');
}
window._fsAttPending={}; // {stuId: bool}
function fsAttMark(sid,present){
  window._fsAttPending[sid]=present;
  // update visual
  const row=document.querySelector(`[data-att-sid="${sid}"]`);
  if(row){
    row.style.background=present?'#F0FDF4':'#FEF2F2';
    row.style.borderColor=present?'var(--gn)':'var(--rd)';
    row.querySelectorAll('button').forEach(b=>{
      const isP=b.dataset.p==='1';
      const active=(isP&&present)||(!isP&&!present);
      b.style.background=active?(isP?'var(--gn)':'var(--rd)'):'#fff';
      b.style.color=active?'#fff':(isP?'var(--gn)':'var(--rd)');
    });
  }
  const lbl=document.getElementById('fsAttPendingLbl');
  if(lbl)lbl.innerHTML=`<i class="ti ti-alert-circle" style="color:var(--am)"></i> มี ${Object.keys(window._fsAttPending).length} คนที่เปลี่ยนแปลง`;
}
function fsRenderAttCheck(cid,sid,g){
  const today=new Date().toISOString().slice(0,10);
  if(!fsSelDate)fsSelDate=today;
  const date=fsSelDate;
  const stus=stuArr(cid);
  const members=[g.leaderId,...(g.memberIds||[])].map(id=>stus.find(s=>s.id===id)).filter(Boolean).sort((a,b)=>a.no-b.no);
  const round=fsActiveRoundStu(cid);
  const rec=_fsAttOfDayStu(cid,g.id,date);
  window._fsAttPending={};
  const roundBadge=round?
    `<span style="font-size:11px;background:var(--gn);color:#fff;padding:2px 8px;border-radius:6px">${round.name}</span>`:
    `<span style="font-size:11px;background:var(--am);color:#fff;padding:2px 8px;border-radius:6px">ยังไม่มีรอบ active — แจ้งครู</span>`;
  let html=`<div class="card">
    <div class="card-hd"><div class="card-hd-title"><i class="ti ti-user-check"></i> ${g.name} · เช็คสมาชิก ${roundBadge}</div></div>
    <div class="card-bd">
      <div class="fg">
        <label class="fl"><i class="ti ti-calendar"></i> วันที่</label>
        <input type="date" value="${date}" onchange="fsSelDate=this.value;renderFiveSStu()">
      </div>
      <div style="font-size:12px;color:var(--mu);padding:8px;background:var(--sf2);border-radius:6px;margin-bottom:10px">
        <i class="ti ti-info-circle"></i> กด "มา" ถ้าสมาชิกมาทำ · "ไม่มา" ถ้าไม่มา · <b>กดบันทึก</b>เมื่อเช็คเสร็จ
      </div>`;
  members.forEach(m=>{
    const cur=rec[m.id];
    const present=cur?cur.present:true;
    const isLeader=m.id===g.leaderId;
    html+=`<div data-att-sid="${m.id}" style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:${present?'#F0FDF4':'#FEF2F2'};border:1.5px solid ${present?'var(--gn)':'var(--rd)'};border-radius:8px;margin-bottom:6px">
      <span style="min-width:32px;font-weight:700;color:var(--mu)">${m.no}</span>
      <span style="flex:1;font-size:14px;font-weight:600">${m.firstName} ${m.lastName}${isLeader?' <i class="ti ti-crown" style="color:#B45309"></i>':''}</span>
      <button data-p="1" onclick="fsAttMark('${m.id}',true)" style="padding:5px 12px;border:1.5px solid var(--gn);border-radius:6px;background:${present?'var(--gn)':'#fff'};color:${present?'#fff':'var(--gn)'};font-weight:600;cursor:pointer">มา</button>
      <button data-p="0" onclick="fsAttMark('${m.id}',false)" style="padding:5px 12px;border:1.5px solid var(--rd);border-radius:6px;background:${!present?'var(--rd)':'#fff'};color:${!present?'#fff':'var(--rd)'};font-weight:600;cursor:pointer">ไม่มา</button>
    </div>`;
  });
  html+=`</div>
    <div class="cp" style="border-top:1px solid var(--bd);background:var(--sf2)">
      <div class="f g8" style="justify-content:space-between;align-items:center">
        <div id="fsAttPendingLbl" style="font-size:12px;color:var(--mu)"><i class="ti ti-info-circle"></i> ยังไม่มีการเปลี่ยนแปลง</div>
        <button class="btn btn-p" onclick="fsSaveAtt('${cid}','${g.id}')"><i class="ti ti-device-floppy"></i> บันทึก</button>
      </div>
    </div>
  </div>`;
  return html;
}
async function fsSaveAtt(cid,gid){
  _lastSaveTimeStu=Date.now();
  const date=fsSelDate;
  const round=fsActiveRoundStu(cid);
  const roundId=round?round.id:null;
  const stus=stuArr(cid);
  const g=fsMyGroup(cid,me.studentId);if(!g)return;
  const memberIds=new Set([g.leaderId,...(g.memberIds||[])].filter(Boolean));
  const rec=_fsAttOfDayStu(cid,gid,date);
  const pending=window._fsAttPending||{};
  const rows=[];
  memberIds.forEach(sid=>{
    let present=true;
    if(pending[sid]!==undefined)present=pending[sid];
    else if(rec[sid])present=rec[sid].present;
    rows.push({group_id:gid,student_id:sid,date,present,checker:'leader',round_id:roundId});
  });
  try{

async function fsSaveAll(){

  const cid=form.dataset.cid, gid=form.dataset.gid, date=form.dataset.date;

    items[cb.dataset.idx]=cb.checked;
  });

      group_id:gid,date,items,note,round_id:roundId,checker:'leader'
    },{onConflict:'group_id,date'});

// บันทึกเฉพาะข้อมูล 5ส (groups + members + checks) — ประหยัดเวลา
async function _save5sTables(){
  const groupRows=[], memberRows=[];
  Object.keys((db.fiveS||{}).groups||{}).forEach(tkey=>{
    const cid=tkey.split('__')[1]||tkey;
    (db.fiveS.groups[tkey]||[]).forEach(g=>{
      groupRows.push({
        id:g.id, class_id:cid, name:g.name,
        leader_id:g.leaderId||null, items:g.items||null
      });
      (g.memberIds||[]).forEach(sid=>{
        memberRows.push({group_id:g.id,student_id:sid});
      });
    });
  });
  try{
    if(groupRows.length) await sb.from('five_s_groups').upsert(groupRows,{onConflict:'id'});
    if(memberRows.length){
      const gids=[...new Set(memberRows.map(r=>r.group_id))];
      for(const gid of gids){
        await sb.from('five_s_members').delete().eq('group_id',gid);
      }
      await sb.from('five_s_members').insert(memberRows);
    }
    // หมายเหตุ: five_s_group_checks + five_s_attendance ถูกบันทึกโดยตรงใน
    // fsSaveAll (เช็คงาน) และ fsSaveAtt (เช็คสมาชิก) → ไม่ต้อง sync ที่นี่
    return true;
  }catch(e){console.error('5s save error:',e);return false;}
}

function saveDbNow(){
  try{localStorage.setItem('crDB4',JSON.stringify(db));}catch(e){}
  _lastSaveTimeStu=Date.now();
  _save5sTables();
}
function saveDbSilent(){
  try{localStorage.setItem('crDB4',JSON.stringify(db));}catch(e){}
  clearTimeout(window._fsSave);
  window._fsSave=setTimeout(async()=>{
    _lastSaveTimeStu=Date.now();
    await _save5sTables();
  },1500);
}

function fsRenderMembers(cid,sid,g){
  const stus=stuArr(cid);
  const groups=fsGroupsStu(cid);
  // คนที่อยู่ในกลุ่มอื่นแล้ว (ไม่รวมกลุ่มเรา)
  const assignedElsewhere=new Set();
  groups.forEach(g2=>{
    if(g2.id===g.id)return;
    if(g2.leaderId)assignedElsewhere.add(g2.leaderId);
    (g2.memberIds||[]).forEach(id=>assignedElsewhere.add(id));
  });
  const myMembers=(g.memberIds||[]).map(id=>stus.find(s=>s.id===id)).filter(Boolean).sort((a,b)=>a.no-b.no);
  const available=stus.filter(s=>s.id!==g.leaderId && !g.memberIds.includes(s.id) && !assignedElsewhere.has(s.id));
  const leader=stus.find(s=>s.id===g.leaderId);
  let html=`<div class="card">
    <div class="card-hd"><div class="card-hd-title"><i class="ti ti-users"></i> สมาชิก ${g.name}</div></div>
    <div class="card-bd">
      <div style="padding:10px;background:#FEF3C7;border-radius:6px;margin-bottom:12px">

      </div>

    html+=`<div style="padding:14px;background:var(--sf2);border-radius:6px;text-align:center;font-size:12px;color:var(--mu)">ยังไม่มีสมาชิก · กดปุ่มด้านล่างเพื่อเพิ่ม</div>`;

    myMembers.forEach(m=>{

    <button class="btn btn-tl btn-full" onclick="fsOpenAddMember('${cid}','${g.id}')"${!available.length?' disabled':''}><i class="ti ti-user-plus"></i> เพิ่มสมาชิก ${available.length?`(มี ${available.length} คนว่าง)`:'(ไม่มีคนว่าง)'}</button>

// ── สรุปผล ──
function fsRenderSummary(cid,sid,g,items){
  const stus=stuArr(cid);
  const members=[g.leaderId,...(g.memberIds||[])].map(id=>stus.find(s=>s.id===id)).filter(Boolean).sort((a,b)=>a.no-b.no);
  const today=new Date();
  const dates=[];
  for(let i=13;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    dates.push(d.toISOString().slice(0,10));
  }
  // นับ per stu
  const perStu={};
  let totalP=0,totalD=0,daysWith=0;
  members.forEach(m=>{perStu[m.id]={name:m.firstName+' '+m.lastName,no:m.no,done:0,total:0};});
  dates.forEach(d=>{
    const c=fsChecksStu(cid,g.id,d);
    if(!Object.keys(c).length)return;
    daysWith++;
    members.forEach(m=>{
      items.forEach((it,i)=>{
        const done=((c[m.id]||{}).items||{})[i]===true;
        totalP++;perStu[m.id].total++;
        if(done){totalD++;perStu[m.id].done++;}
      });
    });
  });
  const pct=totalP?Math.round(totalD/totalP*100):0;
  const pctCol=pct>=80?'var(--gn)':pct>=60?'var(--am)':'var(--rd)';
  let html=`<div class="profile-card" style="text-align:center">
    <div style="font-size:12px;opacity:.85"><i class="ti ti-chart-bar"></i> สรุป 14 วันล่าสุด</div>
    <div style="font-weight:700;font-size:15px;margin-top:2px">${g.name}</div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.2)">
      <div style="font-size:12px;opacity:.85">คะแนนกลุ่ม</div>
      <div style="font-size:32px;font-weight:800">${pct}%</div>
      <div style="font-size:11px;opacity:.85">${daysWith} วันที่เช็ค</div>
    </div>
  </div>
  <div class="card mt14">
    <div class="card-hd"><div class="card-hd-title"><i class="ti ti-users"></i> คะแนนรายบุคคล</div></div>
    <div class="card-bd" style="padding:0">`;
  if(!daysWith){
    html+=`<div style="padding:20px;text-align:center;color:var(--mu);font-size:12.5px">ยังไม่มีข้อมูลใน 14 วันที่ผ่านมา</div>`;
  } else {
    Object.values(perStu).sort((a,b)=>a.no-b.no).forEach(s=>{
      const p=s.total?Math.round(s.done/s.total*100):0;
      const col=p>=80?'var(--gn)':p>=60?'var(--am)':'var(--rd)';
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)">
        <div>
          <div style="font-size:13px;font-weight:600">${s.no}. ${s.name}</div>
          <div style="font-size:11px;color:var(--mu)">${s.done}/${s.total} ครั้ง</div>
        </div>
        <div style="font-size:18px;font-weight:800;color:${col}">${p}%</div>
      </div>`;
    });
  }
  html+=`</div></div>`;
  return html;
}

let _stuAnnouncements=[];

function _escStu(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function loadStudentAnnouncements(){
  if(!me)return [];
  try{
    const nowIso=new Date().toISOString();
    const {data,error}=await sb.from('announcements').select('*').eq('active',true).order('published_at',{ascending:false}).limit(50);
    if(error)throw error;
    _stuAnnouncements=(data||[]).filter(a=>(!a.class_id||a.class_id===me.classId)&&(!a.expires_at||a.expires_at>=nowIso));
  }catch(e){console.warn('announcements:',e.message);_stuAnnouncements=[];}
  return _stuAnnouncements;
}

  const cid=me.classId,sid=me.studentId,subs=subArr(cid),events=[];
  subs.forEach(sub=>((asgBlock(cid)[sub.id])||[]).forEach(a=>{
    if(!a.dueDate)return;
    const v=((scBlock(cid)[sub.id]||{})[a.id]||{})[sid];
    const done=a.type==='track'?(v==='ตรงเวลา'||v==='ส่งช้า'):(v!==undefined&&v!==''&&!isNaN(parseFloat(v)));
    events.push({date:a.dueDate,title:a.name,subject:sub.name,done,type:a.type});
  }));
  return events;
}
function _calShift(n){_calCursor=new Date(_calCursor.getFullYear(),_calCursor.getMonth()+n,1);renderStudentCalendar();}
function _calToday(){_calCursor=new Date();renderStudentCalendar();}
function _openCalDay(dateStr){
  const es=_studentDueEvents().filter(e=>e.date===dateStr);
  if(!es.length){showToast('วันนี้ไม่มีงานครบกำหนด');return;}
  showMD(`<div class="mt"><i class="ti ti-calendar-event"></i> กำหนดส่ง ${thDate(dateStr)}</div>${es.map(e=>`<div style="padding:10px;border-bottom:1px solid var(--bd)"><div style="font-weight:700">${_escStu(e.title)}</div><div style="font-size:11px;color:var(--mu)">${_escStu(e.subject)}</div><div style="margin-top:5px">${e.done?'<span class="badge bg">เสร็จแล้ว</span>':'<span class="badge ba">ยังไม่เสร็จ</span>'}</div></div>`).join('')}<div style="text-align:right;margin-top:12px"><button class="btn btn-tl" onclick="closeMD();switchTab('assignments')">ไปหน้างาน</button></div>`);
}
function renderStudentCalendar(){
  const el=document.getElementById('mainContent');
  const y=_calCursor.getFullYear(),m=_calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),events=_studentDueEvents();
  const by={};events.forEach(e=>(by[e.date]||(by[e.date]=[])).push(e));
  const thMonths=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let html=`<div class="cal-toolbar"><button class="btn btn-sm" onclick="_calShift(-1)"><i class="ti ti-chevron-left"></i></button><div style="text-align:center"><div style="font-size:17px;font-weight:800">${thMonths[m]} ${y+543}</div><button class="btn btn-xs" onclick="_calToday()">เดือนนี้</button></div><button class="btn btn-sm" onclick="_calShift(1)"><i class="ti ti-chevron-right"></i></button></div><div class="cal-grid">`;
  ['อา','จ','อ','พ','พฤ','ศ','ส'].forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  const start=new Date(y,m,1-first.getDay());
  const today=todayStr();
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const ds=d.toISOString().slice(0,10),same=d.getMonth()===m,es=by[ds]||[],pending=es.filter(e=>!e.done).length;
    html+=`<div class="cal-day ${same?'':'muted'} ${ds===today?'today':''}" onclick="_openCalDay('${ds}')"><div class="cal-num">${d.getDate()}</div>${es.length?`<div class="cal-dot"></div><div class="cal-count">${pending?pending+' ค้าง':es.length+' เสร็จ'}</div>`:''}</div>`;
  }
  html+='</div>';
  const upcoming=events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);
  html+=`<div class="card" style="margin-top:14px"><div class="card-hd"><div class="card-hd-title"><i class="ti ti-list-check"></i> กำหนดส่งถัดไป</div></div><div class="card-bd" style="padding:0">${upcoming.length?upcoming.map(e=>`<div style="padding:10px 13px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px"><div><b>${_escStu(e.title)}</b><div style="font-size:11px;color:var(--mu)">${_escStu(e.subject)}</div></div><div style="text-align:right;font-size:11px">${thDate(e.date)}<br>${e.done?'<span class="badge bg">เสร็จ</span>':'<span class="badge ba">ยังไม่เสร็จ</span>'}</div></div>`).join(''):'<div class="empty">ยังไม่มีกำหนดส่ง</div>'}</div></div>`;
  el.innerHTML=html;
}

async function _markPracticeQuizDone(quiz){
  if(!me||!quiz)return;
  try{
    const assigned=quiz.assigned_classes||[];
    const mine=assigned.find(a=>a.class_id===me.classId);
    const cid=mine?.class_id||me.classId;
    const subid=mine?.subject_id||quiz.subject_id;
    const asgId='asg_qz_practice_'+quiz.id+'_'+cid;
    await sb.from('assignments').upsert({id:asgId,class_id:cid,subject_id:subid,name:'[ฝึกทำ] '+quiz.title,max_score:0,type:'track'},{onConflict:'id'});

}
