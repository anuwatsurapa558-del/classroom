/* ══════════════════════════════════════════════════════════════════
   v12 Student announcements: attachments + discussion replies
   ══════════════════════════════════════════════════════════════════ */
const ANN_FILE_BUCKET='announcement_files';
let _stuAnnFiles={},_stuAnnReplyCounts={};
function _annPublicUrlStu(path){try{return sb.storage.from(ANN_FILE_BUCKET).getPublicUrl(path).data.publicUrl||'#';}catch(e){return '#';}}
function _annFileSizeStu(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1024/1024).toFixed(1)+' MB';}

loadStudentAnnouncements=async function(){
  if(!me)return [];
  try{
    const nowIso=new Date().toISOString();
    const {data,error}=await sb.from('announcements').select('*').eq('active',true).order('published_at',{ascending:false}).limit(50);
    if(error)throw error;
    _stuAnnouncements=(data||[]).filter(a=>(!a.class_id||a.class_id===me.classId)&&(!a.expires_at||a.expires_at>=nowIso));
    const ids=_stuAnnouncements.map(x=>x.id);_stuAnnFiles={};_stuAnnReplyCounts={};
    if(ids.length){
      const [fr,rr]=await Promise.all([
        sb.from('announcement_attachments').select('*').in('announcement_id',ids).order('created_at'),
        sb.from('announcement_replies').select('id,announcement_id').in('announcement_id',ids)
      ]);
      if(!fr.error)(fr.data||[]).forEach(f=>(_stuAnnFiles[f.announcement_id]||(_stuAnnFiles[f.announcement_id]=[])).push(f));
      if(!rr.error)(rr.data||[]).forEach(r=>_stuAnnReplyCounts[r.announcement_id]=(_stuAnnReplyCounts[r.announcement_id]||0)+1);
    }
  }catch(e){console.warn('announcements:',e.message);_stuAnnouncements=[];_stuAnnFiles={};_stuAnnReplyCounts={};}
  return _stuAnnouncements;
};

renderStudentAnnouncements=async function(){
  const el=document.getElementById('mainContent');
  el.innerHTML='<div class="loading"><div class="spinner"></div> กำลังโหลดประกาศ...</div>';
  await loadStudentAnnouncements();
  let html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div><div style="font-size:18px;font-weight:800">ประกาศจากครู</div><div style="font-size:11px;color:var(--mu)">อ่านไฟล์แนบและตอบกลับครูได้</div></div><span class="badge bt">'+_stuAnnouncements.length+' รายการ</span></div>';
  if(!_stuAnnouncements.length)html+='<div class="card"><div class="empty"><i class="ti ti-speakerphone"></i><div>ยังไม่มีประกาศ</div></div></div>';
  else _stuAnnouncements.forEach(a=>{
    const urg=a.priority==='urgent',files=_stuAnnFiles[a.id]||[],rc=_stuAnnReplyCounts[a.id]||0;
    html+=`<div class="ann-card ${urg?'urgent':''}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${urg?'⚠️ ':''}${_escStu(a.title)}</b>${urg?'<span class="badge br">สำคัญ</span>':''}</div><div style="font-size:13px;margin-top:6px;white-space:pre-wrap">${_escStu(a.body||'')}</div>
      ${files.length?`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bd)"><div style="font-size:11px;font-weight:700;margin-bottom:5px"><i class="ti ti-paperclip"></i> ไฟล์แนบ ${files.length} ไฟล์</div><div style="display:flex;flex-wrap:wrap;gap:6px">${files.map(f=>`<a href="${_annPublicUrlStu(f.file_path)}" target="_blank" class="btn btn-sm btn-outline" style="padding:6px 9px;max-width:100%"><i class="ti ti-download"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px">${_escStu(f.file_name)}</span><small>${_annFileSizeStu(f.file_size)}</small></a>`).join('')}</div></div>`:''}
      <div class="ann-meta" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span><i class="ti ti-clock"></i> ${new Date(a.published_at).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}</span><button class="btn btn-sm btn-outline" onclick="openStudentAnnouncementThread(${a.id})"><i class="ti ti-message-circle"></i> ตอบกลับ ${rc?`(${rc})`:''}</button></div></div>`;
  });
  el.innerHTML=html;
};

async function openStudentAnnouncementThread(annId){
  showMD('<div class="mt"><i class="ti ti-message-circle"></i> ข้อความตอบกลับ</div><div class="loading"><div class="spinner"></div> กำลังโหลด...</div>');

    <div style="max-height:330px;overflow:auto;border:1px solid var(--bd);border-radius:10px">${replies.length?replies.map(r=>`<div style="padding:10px 11px;border-bottom:1px solid var(--bd);background:${r.student_id===me.studentId?'var(--tll)':'var(--sf)'}"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:12px">${r.role==='teacher'?'<span style="color:var(--bl)"><i class="ti ti-school"></i> ครู</span>':_escStu(r.author_name||'นักเรียน')}</b><small style="color:var(--mu)">${new Date(r.created_at).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</small></div><div style="white-space:pre-wrap;font-size:13px;margin-top:3px">${_escStu(r.body)}</div></div>`).join(''):'<div class="empty" style="padding:20px">ยังไม่มีข้อความตอบกลับ</div>'}</div>
    <div class="fg" style="margin-top:12px"><label class="fl">ตอบกลับ</label><textarea id="stuAnnReply" rows="3" maxlength="1500" placeholder="พิมพ์ข้อความถึงครู..."></textarea><div style="font-size:10px;color:var(--mu);margin-top:3px">ข้อความนี้จะมองเห็นได้โดยครูและนักเรียนที่เห็นประกาศนี้</div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeMD()">ปิด</button><button class="btn btn-tl" onclick="postStudentAnnouncementReply(${annId})"><i class="ti ti-send"></i> ส่ง</button></div>`;
}

async function postStudentAnnouncementReply(annId){
  const body=(document.getElementById('stuAnnReply')?.value||'').trim();if(!body){showToast('พิมพ์ข้อความก่อน');return;}
  const stu=stuArr(me.classId).find(x=>x.id===me.studentId);const author=stu?`${stu.firstName||''} ${stu.lastName||''}`.trim():'นักเรียน';
  try{
    const r=await sb.from('announcement_replies').insert({announcement_id:annId,student_id:me.studentId,role:'student',author_name:author,body});if(r.error)throw r.error;
    _lastSaveTimeStu=Date.now();_stuAnnReplyCounts[annId]=(_stuAnnReplyCounts[annId]||0)+1;await openStudentAnnouncementThread(annId);showToast('ส่งข้อความแล้ว ✓');
  }catch(e){alert('ส่งข้อความไม่สำเร็จ: '+e.message);}
}


/* ═══ Grade calculation V13: รองรับงานแยก/ช่องคะแนน/เกรดครูกำหนด ═══ */
function _stuGradeComps(subid){return (db.gradeComponents?.[subid]||[]).slice().sort((a,b)=>(a.orderNum||0)-(b.orderNum||0));}
function _stuCompVal(compId,stuId){const v=((db.gradeComponentScores||{})[compId]||{})[stuId];return v===undefined||v===null||v===''?null:parseFloat(v);}
function _stuGradeOverride(subid,stuId){return ((db.gradeOverrides||{})[subid]||{})[stuId]||{gradeOverride:'',note:''};}
function _stuGradeClass(g){return g==='4'?'g4':g==='3.5'?'g35':g==='3'?'g3':g==='2.5'?'g25':g==='2'?'g2':g==='1.5'?'g15':g==='1'?'g1':'g0';}
function calcTotal(cid,subid,stuId){const sub=subArr(cid).find(s=>s.id===subid);if(!sub)return{assignScore:0,examScore:0,totalScore:0,wA:70,wE:30,grade:{g:'0',cls:'g0'},finalGrade:'0',finalCls:'g0',note:'',missing:0};const wA=parseFloat(sub.wAssign??70)||0,wE=parseFloat(sub.wExam??30)||0,asgs=(asgBlock(cid)[subid])||[],scoreAsgs=asgs.filter(a=>a.type!=='track'),trackAsgs=asgs.filter(a=>a.type==='track'),sep=scoreAsgs.filter(a=>a.gradeMode==='separate'),pool=scoreAsgs.filter(a=>a.gradeMode!=='separate'),comps=_stuGradeComps(subid);const sepReserved=sep.reduce((s,a)=>s+(parseFloat(a.gradePoints??a.maxScore)||0),0),customReserved=comps.reduce((s,c)=>s+(parseFloat(c.maxScore)||0),0),poolWeight=Math.max(0,wA-sepReserved-customReserved);let raw=0,max=0,missingScore=0;pool.forEach(a=>{const m=parseFloat(a.maxScore)||0;max+=m;const v=((scBlock(cid)[subid]||{})[a.id]||{})[stuId];if(v!==undefined&&v!==''&&!isNaN(parseFloat(v)))raw+=Math.min(parseFloat(v),m);else missingScore++;});let assignScore=max?raw/max*poolWeight:0;sep.forEach(a=>{const m=parseFloat(a.maxScore)||0,p=parseFloat(a.gradePoints??a.maxScore)||0,v=((scBlock(cid)[subid]||{})[a.id]||{})[stuId];if(v!==undefined&&v!==''&&!isNaN(parseFloat(v))&&m>0)assignScore+=Math.min(parseFloat(v),m)/m*p;else missingScore++;});comps.forEach(c=>{const v=_stuCompVal(c.id,stuId);if(v!==null&&!isNaN(v))assignScore+=Math.min(Math.max(v,0),parseFloat(c.maxScore)||0);});assignScore=Math.min(wA,assignScore);let missingTrack=0;trackAsgs.forEach(a=>{const v=((scBlock(cid)[subid]||{})[a.id]||{})[stuId];if(v!=='ตรงเวลา'&&v!=='ส่งช้า')missingTrack++;});const ex=((exBlock(cid)[subid])||{})[stuId]||{},midMax=parseFloat(sub.midMax)||0,finMax=parseFloat(sub.finalMax)||0,midRaw=ex.mid!==undefined&&ex.mid!==''&&!isNaN(parseFloat(ex.mid))?parseFloat(ex.mid):null,finRaw=ex.final!==undefined&&ex.final!==''&&!isNaN(parseFloat(ex.final))?parseFloat(ex.final):null,examMax=midMax+finMax,examScore=examMax?((midRaw??0)+(finRaw??0))/examMax*wE:0,totalScore=Math.min(100,assignScore+examScore),roundedTotalScore=Math.round(totalScore),gradeObj=calcGrade(roundedTotalScore),ov=_stuGradeOverride(subid,stuId),finalGrade=ov.gradeOverride||gradeObj.g;return{assignScore:Math.round(assignScore),examScore:Math.round(examScore),totalScore:roundedTotalScore,wA,wE,grade:gradeObj,finalGrade,finalCls:_stuGradeClass(finalGrade),note:ov.note||'',missing:missingScore+missingTrack};}
